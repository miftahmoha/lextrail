<html class="light-mode">
<head>
    <title>Lextrail Simulator</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <script src="https://unpkg.com/vis-network@latest/dist/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/vis-network@latest/dist/vis-network.min.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Subgraphs</h2>
            <div class="pulsing-dot"></div>
        </div>
        <p>Select a subgraph to visualize</p>
        <div id="sidebar-items"></div>
    </div>
    
    <div class="main-content">
        <button class="theme-toggle" id="theme-toggle">
            <i class="fas fa-moon"></i>
        </button>
        <h1>Lextrail Simulator <span class="subtitle">v2.0</span></h1>
        <div class="status" id="status">Loading graphs from server...</div>
        
        <div class="controls">
            <button id="btn-prev" disabled><i class="fas fa-chevron-left"></i></button>
            <button id="btn-toggle-pause"><i class="fas fa-pause"></i></button>
            <button id="btn-next" disabled><i class="fas fa-chevron-right"></i></button>
            <div class="frame-counter" id="frame-counter">Frame 0/0</div>
            <button id="btn-interrupt" class="danger"><i class="fas fa-stop"></i></button>
            <button id="btn-reset"><i class="fas fa-sync-alt"></i></button>
            
            <div class="speed-control">
                <label>Delay:</label>
                <input type="range" id="speed-slider" min="0" max="2000" value="500" class="speed-slider">
                <input type="number" id="speed-input" min="0" value="500" class="speed-input">
                <span>ms</span>
                <button id="apply-speed"><i class="fas fa-check"></i></button>
            </div>
        </div>
        <div class="graph-container" id="current-graph"></div>
        <textarea class="llm-response" id="llm-response" readonly>Waiting for LLM response...</textarea>
    </div>
</body>
</html>
