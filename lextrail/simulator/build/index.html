<html class="light-mode">

<head>
    <title>Lextrail Simulator</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="vis-network.min.js"></script>
    <!-- <script src="https://unpkg.com/vis-network@latest/dist/vis-network.min.js"></script> -->
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Subgraphs</h2>
            <div class="pulsing-dot"></div>
        </div>
        <p>Select a subgraph to visualize</p>
        <div class="sidebar-navigation">
            <button id="sidebar-prev-btn" class="fas fa-chevron-left"></i></button>
            <div class="sidebar-indicator" id="indicator">
                <div class="indicator-dot active"> </div>
                <div class="indicator-dot"> </div>
                <div class="indicator-dot"> </div>
                <div class="indicator-dot"> </div>
            </div>
            <button id="sidebar-next-btn" class="fas fa-chevron-right"></i></button>
        </div>
        <div id="current-sidebar"></div>
        <!-- Adding to thing accordingly each side-items-x to highlight following the buttons (remove the previous from sidebar), side-items-1 is the default. -->
    </div>

    <div class="main-content">
        <button class="theme-toggle" id="theme-toggle">
            <i class="fas fa-moon"></i>
        </button>
        <h1>Lextrail Simulator <span class="subtitle">v2.0</span></h1>
        <div class="status" id="status">Loading graphs from server...</div>

        <div class="controls">
            <button id="btn-prev" disabled><i class="fas fa-chevron-left"></i></button>
            <button id="btn-pause"><i class="fas fa-pause"></i></button>
            <button id="btn-next" disabled><i class="fas fa-chevron-right"></i></button>
            <div class="frame-counter" id="frame-counter">Frame 0/0</div>
            <button id="btn-interrupt" class="danger"><i class="fas fa-stop"></i></button>
            <button id="btn-reset"><i class="fas fa-sync-alt"></i></button>

            <div class="delay-control">
                <label>Delay:</label>
                <input type="range" id="delay-slider" min="0" max="2000" value="1000" class="delay-slider">
                <input type="number" id="delay-input" min="0" value="1000" class="delay-input">
                <span>ms</span>
                <button id="btn-delay"><i class="fas fa-check"></i></button>
            </div>
        </div>
        <!-- [TODO] Merge graph-container with current-graph-container. -->
        <div class="graph-container current-graph-container" id="current-display">
        </div>
        <textarea class="llm-response" id="llm-response" readonly>Waiting for LLM response...</textarea>
    </div>
</body>

</html>
